cocktails:
  - title: Ember & Rye
    description: Burnt orange, rye, a long slow stir.
    image: /images/ember-and-rye.jpg
    glass: rocks
    ingredients:
      - item: Rye whiskey
        amount: 60 ml
      - item: Burnt orange oleo
        amount: 10 ml
      - item: Demerara syrup
        amount: 5 ml
      - item: Angostura bitters
        amount: 2 dashes
      - item: Orange peel
        amount: 1 wide strip
    steps:
      - Char a strip of orange peel over a flame until it blisters.
      - Combine spirits, oleo, syrup and bitters over ice; stir 40 turns.
      - Strain over one large block in a rocks glass.
      - Express the charred peel over the surface and drop it in.
    body: |-
      A rye old fashioned taken darker: the orange is burnt over coals before it goes
      in, so the drink reads smoky before it reads sweet. Stirred long over one block
      and left to open up in the glass.
  - title: Nightjar
    description: Rye, sweet vermouth and a spoonful of cherry brine.
    image: /images/nightjar.jpg
    glass: rocks
    ingredients:
      - item: Rye whiskey
        amount: 60 ml
      - item: Sweet vermouth
        amount: 25 ml
      - item: Brine from the cherry jar
        amount: 5 ml
      - item: Angostura bitters
        amount: 2 dashes
      - item: Brandied cherries
        amount: 2
    steps:
      - Stir the rye, vermouth, brine and bitters over cracked ice for 25 seconds.
      - Strain over one large cube in a chilled rocks glass.
      - Skewer two cherries and lay them across the rim.
    body: |-
      A Manhattan with the sweetness pulled back and the cherry pushed forward — the
      brine does the work sugar usually does, so the drink finishes dry instead of
      sticky. Best made with a vermouth that has been open less than a week.
  - title: Smoke Signal
    description: Mezcal and amaro under a cloche of rosemary smoke.
    image: /images/smoke-signal.jpg
    glass: rocks
    ingredients:
      - item: Espadín mezcal
        amount: 50 ml
      - item: Amaro Montenegro
        amount: 15 ml
      - item: Lime juice
        amount: 15 ml
      - item: Agave syrup (2:1)
        amount: 10 ml
      - item: Rosemary sprig
        amount: 1
      - item: Dried orange wheel
        amount: 1
    steps:
      - Smoulder the rosemary and trap the smoke under an upturned glass for half a minute.
      - Shake the mezcal, amaro, lime and agave hard with cubed ice for ten seconds.
      - Strain into the smoked glass over fresh ice.
      - Garnish with the dried orange wheel and the spent rosemary.
    body: |-
      The smoke is doing something specific here: mezcal already carries smoke from the
      roasting pit, and rosemary sits just to one side of it, so the two read as one
      long note rather than two competing ones. Don't let the rosemary catch flame —
      it should smoulder.
  - title: Velvet Hour
    description: A bourbon sour softened with amaro, served with a thick head.
    image: /images/velvet-hour.jpg
    glass: coupe
    ingredients:
      - item: Bourbon
        amount: 50 ml
      - item: Amaro Nonino
        amount: 15 ml
      - item: Lemon juice
        amount: 22 ml
      - item: Demerara syrup (2:1)
        amount: 10 ml
      - item: Egg white
        amount: 1
    steps:
      - Dry shake everything without ice for fifteen seconds to build the foam.
      - Add cubed ice and shake hard for another twelve.
      - Double strain into a chilled coupe and let the head settle before serving.
      - Three drops of bitters on the foam, dragged through with a pick.
    body: |-
      The last drink of the night. Amaro takes the edge off the lemon and gives the
      finish something bitter to land on, which keeps a sour this rich from cloying.
      The dry shake is not optional — it's the whole texture.
  - title: Paper Lantern
    description: Sake, yuzu and a green chartreuse whisper.
    image: /images/paper-lantern.jpg
    glass: martini
    ingredients:
      - item: Junmai sake
        amount: 45 ml
      - item: Yellow Chartreuse
        amount: 10 ml
      - item: Yuzu juice
        amount: 15 ml
      - item: Elderflower cordial
        amount: 10 ml
      - item: Mint
        amount: 1 sprig
    steps:
      - Chill the glass in the freezer for ten minutes.
      - Shake the sake, Chartreuse, yuzu and cordial briefly with ice — eight seconds, no more.
      - Fine strain into the frozen glass.
      - Slap a sprig of mint between your palms and rest it on the surface.
    body: |-
      Light and dry, and easy to overwork. Junmai sake carries yuzu without letting it
      turn sharp, but it bruises if you shake it like a sour — keep it short and keep
      it cold. The mint is aromatic only; it never goes in the drink.
  - title: Salt Flats
    description: Tequila and grapefruit with a chilli-salt rim.
    image: /images/salt-flats.jpg
    glass: highball
    ingredients:
      - item: Blanco tequila
        amount: 50 ml
      - item: Pink grapefruit juice
        amount: 40 ml
      - item: Lime juice
        amount: 10 ml
      - item: Agave syrup (2:1)
        amount: 10 ml
      - item: Grapefruit soda
        amount: 60 ml
      - item: Chilli salt
        amount: for the rim
    steps:
      - >-
        Wet half the rim with a lime wedge and roll it through chilli salt — half, so there's a way
        out.
      - Build the tequila, juices and agave in the glass and fill with cubed ice.
      - Top with grapefruit soda poured from height.
      - Stir once, from the bottom.
    body: |-
      A paloma with the salt taken seriously. Rimming only half the glass lets whoever
      is drinking it decide how much salt they want, which matters more than it
      sounds — the salt is what makes the grapefruit taste sweet.
