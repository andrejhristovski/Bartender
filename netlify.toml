[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS talks to these two paths; they map to the OAuth functions below.
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/callback"
  to = "/.netlify/functions/callback"
  status = 200

# The CMS is a real page, not a React route — keep it ahead of the SPA catch-all.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Client-side routing: every other path serves the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
