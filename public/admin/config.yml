# ---------------------------------------------------------------------------
# Decap CMS configuration.
# backend.base_url and site_url are NOT set here on purpose — index.html fills
# them in from the page's own origin, so renaming the site or adding a custom
# domain never breaks the login. See README.md.
# ---------------------------------------------------------------------------
backend:
  name: github
  repo: andrejhristovski/Bartender
  branch: main
  auth_endpoint: api/auth

# `npm run cms` in a second terminal lets you edit locally without logging in.
local_backend: true

media_folder: public/images
public_folder: /images

publish_mode: simple
logo_url: /favicon.svg

collections:
  - name: site
    label: Site text
    files:
      - name: general
        label: Homepage text
        file: src/content/site.md
        fields:
          - { name: name, label: Name, widget: string }
          - { name: kicker, label: Line above the name, widget: string, hint: 'e.g. Bartender · Skopje & elsewhere' }
          - { name: tagline, label: Line under the name, widget: string }
          - name: heroVideo
            label: Background video
            widget: file
            required: false
            media_folder: /public/media
            public_folder: /media
            hint: Optional. Plays muted on a loop behind the name. Keep it under ~5 MB and a few seconds long — it loops. MP4 works everywhere.
          - name: heroPoster
            label: Video still
            widget: image
            required: false
            media_folder: /public/media
            public_folder: /media
            hint: Shown while the video loads, and instead of it for visitors who turn motion off.
          - { name: heroImage, label: Background photo (if no video), widget: image, required: false, hint: Used only when there's no video. Leave everything empty for the lit-glass background. }
          - { name: portrait, label: Portrait photo, widget: image, required: false, hint: Optional. Leave empty to keep the drawn placeholder. }
          - { name: aboutTitle, label: About heading, widget: string }
          - { name: about, label: About text, widget: text }
          - { name: aboutSecondary, label: About — second line, widget: text, required: false }
          - { name: listKicker, label: Cocktails — small label, widget: string }
          - { name: listTitle, label: Cocktails — heading, widget: string }
          - { name: listNote, label: Cocktails — note on the right, widget: string, required: false }
          - name: recipesToShow
            label: How many drinks to show
            widget: number
            required: false
            value_type: int
            min: 0
            step: 1
            hint: Leave empty to show all of them.
          - { name: momentsTitle, label: Moments — heading, widget: string, required: false }
          - { name: momentsNote, label: Moments — small label, widget: string, required: false }
          - name: moments
            label: Moments (photo strip)
            widget: list
            required: false
            fields:
              - { name: label, label: Caption, widget: string }
              - { name: image, label: Photo, widget: image, required: false }
          - { name: bookTitle, label: Book — heading, widget: string }
          - { name: bookText, label: Book — text, widget: text }
          - { name: email, label: Email, widget: string, required: false }
          - { name: instagram, label: Instagram handle, widget: string, required: false, hint: Without the @ }
          - { name: footerNote, label: Footer line, widget: string, required: false }

  - name: cocktails
    label: Cocktails
    files:
      - name: list
        label: All cocktails
        file: src/content/cocktails.yml
        description: >-
          Every drink on the site. Drag a row by the handle on its left to change
          the order they appear in on the homepage — the top one shows first.
        fields:
          - name: cocktails
            label: Drinks
            label_singular: Cocktail
            widget: list
            collapsed: true
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Name, widget: string }
              - { name: description, label: Short description, widget: string, hint: One line — this is what shows on the card }
              - { name: image, label: Photo, widget: image, required: false, hint: Optional. Leave it empty and the drawn glass is used instead. }
              - name: glass
                label: Glass
                widget: select
                default: rocks
                options:
                  - { label: Rocks, value: rocks }
                  - { label: Coupe, value: coupe }
                  - { label: Martini, value: martini }
                  - { label: Highball, value: highball }
                  - { label: Flute, value: flute }
              - name: ingredients
                label: Build
                label_singular: Ingredient
                widget: list
                summary: '{{fields.item}} — {{fields.amount}}'
                fields:
                  - { name: item, label: Ingredient, widget: string }
                  - { name: amount, label: Amount, widget: string, hint: 'e.g. 60 ml' }
              - name: steps
                label: Method
                label_singular: Step
                widget: list
                field: { name: step, label: Step, widget: text }
              - { name: body, label: Full description, widget: text, hint: The longer paragraph shown when someone opens the drink. }
