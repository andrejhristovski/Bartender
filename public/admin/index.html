<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Antonio Nikolovski — Content</title>
    <!-- Pin the config path. Decap otherwise resolves "config.yml" relative to
         the page URL, and this page is served at /admin with no trailing slash,
         which resolves to /config.yml and 404s. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script>
      // Start the CMS by hand so we can fill in one value at runtime.
      window.CMS_MANUAL_INIT = true
    </script>
    <!-- Decap CMS is loaded from a CDN, so it costs the public site nothing. -->
    <script src="https://unpkg.com/decap-cms@^3.9.0/dist/decap-cms.js"></script>
    <script>
      // The OAuth functions live on this same site, so the login URL is just
      // wherever this page is being served from. Deriving it means renaming the
      // Netlify site (or adding a custom domain) can never break the login.
      CMS.init({
        config: {
          backend: { base_url: window.location.origin },
          site_url: window.location.origin,
        },
      })
    </script>
  </body>
</html>
